<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="theme-color" content="#f7f3ed"/>
<title>MAISON</title>
<link rel="manifest" href="manifest.json"/>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/maison.css?v=20261026074418"/>
</head>
<body>
<input type="file" id="file-input" accept="image/*"/>
<input type="file" id="file-input-camera" accept="image/*" capture="environment"/>
<input type="file" id="fp-file-input" accept="image/*"/>
<input type="file" id="rm-tile-input" accept="image/*" multiple/>
<input type="file" id="closet-cam" accept="image/*" capture="environment" onchange="closetFilesPicked(this)"/>
<input type="file" id="closet-lib" accept="image/*" multiple onchange="closetFilesPicked(this)"/>

<!-- SIDE PANEL -->
<div id="panel-overlay" onclick="closeSidePanel()"></div>
<div id="side-panel">
  <div class="panel-head"><div class="panel-title">Gallery</div><button class="panel-close" onclick="closeSidePanel()">×</button></div>
  <div class="panel-mode-tabs"><button class="panel-mode-tab active" id="pmt-photos" onclick="setPanelMode('photos')">Photos</button><button class="panel-mode-tab" id="pmt-links" onclick="setPanelMode('links')">Links</button></div>
  <div class="panel-filter-row" id="panel-filter-row"></div>
  <div class="panel-body" id="panel-body"></div>
</div>

<!-- AUTH -->
<div id="auth-screen">
  <div class="auth-deco">M</div>
  <div class="auth-box">
    <div class="masthead">
      <div class="masthead-sub">Your Private Journal</div>
      <div class="masthead-title">MAISON</div>
      <div class="masthead-rule"></div>
      <div class="masthead-tagline">Home &amp; Wedding Journal</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:18px;margin-top:8px">
      <div id="g_signin_btn"></div>
      <div id="auth-err" class="err-msg" style="display:none"></div>
    </div>
    <p class="auth-note">Sign in with your Google account.<br/>Your data stays private to your account.</p>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header>
    <div class="header-inner">
      <div class="header-top">
        <div class="hdr-left"><button id="hdr-back" class="hdr-back" onclick="goBack()"><span class="chev">‹</span><span id="hdr-back-label">Home</span></button></div>
        <div class="header-brand" onclick="showSection('dashboard')"><div class="brand-name">MAISON</div></div>
        <div class="hdr-right"><button class="header-btn" onclick="openSettings()" aria-label="Settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        </button></div>
      </div>
    </div>
  </header>
  <main id="main-content"></main>
  <div id="camera-dock"></div>
</div>

<div id="modal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal-box" id="modal-box"></div>
</div>

<script src="js/core.js?v=20261026074418"></script>
<script src="js/sync.js?v=20261026074418"></script>
<script src="js/app.js?v=20261026074418"></script>
<script src="js/capture.js?v=20261026074418"></script>
<script src="js/house.js?v=20261026074418"></script>
<script src="js/dayout.js?v=20261026074418"></script>
<script src="js/events-data.js?v=20261026074418"></script>
<script src="js/events-day.js?v=20261026074418"></script>
<script src="js/events-map.js?v=20261026074418"></script>
<script src="js/events-more.js?v=20261026074418"></script>
<script src="js/wedding-recipes.js?v=20261026074418"></script>
<script src="js/moods-dashboard.js?v=20261026074418"></script>
<script src="js/music.js?v=20261026074418"></script>
<script src="js/closet.js?v=20261026074418"></script>
<script src="js/settings.js?v=20261026074418"></script>
</body>
</html>
