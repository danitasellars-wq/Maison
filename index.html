<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="theme-color" content="#f7f3ed"/>
<title>MAISON</title>
<link rel="manifest" href="manifest.json"/>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--serif:'Cormorant Garamond',Georgia,serif;--sans:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;--ink:#1c140a;--cream:#f7f3ed;--bone:#ede4d5;--warm:#c9b89a;--muted:#8a7a68;--red:#a82020;--green:#2a5f3f;--gold:#b8962e;--teal:#2a7070;--plum:#6b4a5e;--section-pad:28px 20px 160px;}
body{font-family:var(--sans);background:var(--cream);color:var(--ink);min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:var(--warm);border-radius:2px}
input,textarea,select{font-family:var(--sans);font-size:16px;background:transparent}
input::placeholder,textarea::placeholder{color:#bbb;}
button{font-family:var(--sans);cursor:pointer;touch-action:manipulation}
a{color:var(--ink)}img{display:block;max-width:100%}select{cursor:pointer}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");opacity:.35;}

/* AUTH */
#auth-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:var(--cream);position:relative;overflow:hidden}
#auth-screen::before,#auth-screen::after{content:'';position:absolute;left:0;right:0;height:4px;background:repeating-linear-gradient(90deg,var(--ink) 0,var(--ink) 35px,transparent 35px,transparent 70px)}
#auth-screen::before{top:0}#auth-screen::after{bottom:0}
.auth-deco{position:absolute;font-family:var(--sans);font-size:220px;font-weight:700;color:var(--bone);pointer-events:none;user-select:none;top:50%;left:50%;transform:translate(-50%,-50%);white-space:nowrap}
.auth-box{max-width:380px;width:100%;position:relative;z-index:1}
.masthead{text-align:center;margin-bottom:48px}
.masthead-sub{font-size:12px;color:var(--warm);font-family:var(--sans);margin-bottom:14px}
.masthead-title{font-family:var(--sans);font-size:80px;font-weight:700;color:var(--ink);line-height:.85;}
.masthead-rule{width:48px;height:1px;background:var(--warm);margin:22px auto 12px}
.masthead-tagline{font-size:12.5px;color:var(--muted);font-family:var(--sans)}
.auth-note{text-align:center;font-size:12px;color:var(--muted);margin-top:18px;line-height:1.6}
.err-msg{color:var(--red);font-size:13px;margin-bottom:12px;}

/* SIDE PANEL */
#panel-overlay{position:fixed;inset:0;background:rgba(28,20,10,.45);z-index:400;display:none;backdrop-filter:blur(4px)}
#panel-overlay.open{display:block}
#side-panel{position:fixed;top:0;left:0;bottom:0;width:300px;max-width:90vw;background:var(--cream);z-index:401;transform:translateX(-100%);transition:transform .3s cubic-bezier(.4,0,.2,1);overflow-y:auto;display:flex;flex-direction:column;border-right:1px solid var(--bone)}
#side-panel.open{transform:translateX(0)}
.panel-head{padding:20px 18px 14px;border-bottom:3px solid var(--ink);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--cream);z-index:1}
.panel-title{font-family:var(--sans);font-size:22px;font-weight:700;}
.panel-close{background:none;border:none;font-size:22px;color:var(--muted);font-family:serif}
.panel-filter-row{display:flex;gap:5px;padding:10px 14px;border-bottom:1px solid var(--bone);flex-wrap:wrap}
.panel-filter{background:none;border:1px solid rgba(28,20,10,.18);color:var(--muted);font-family:var(--sans);font-size:12.5px;padding:3px 8px;transition:all .2s}
.panel-filter.active{background:var(--ink);border-color:var(--ink);color:var(--cream)}
.panel-filter.arch-filter.active{background:var(--muted);border-color:var(--muted)}
.panel-body{padding:14px 18px 80px;flex:1}
.panel-section-label{font-size:12.5px;color:var(--muted);font-family:var(--sans);margin:16px 0 8px;font-weight:600}
.panel-section-label:first-child{margin-top:0}
.panel-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:4px}
.panel-photo{position:relative;overflow:hidden;border:1px solid var(--bone);background:var(--bone);aspect-ratio:1;cursor:pointer;transition:box-shadow .2s}
.panel-photo:hover{box-shadow:0 3px 14px rgba(28,20,10,.14)}
.panel-photo img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
.panel-photo:hover img{transform:scale(1.05)}
.panel-photo-liked{position:absolute;top:5px;left:5px;width:6px;height:6px;border-radius:50%;background:var(--red)}
.panel-photo-like{position:absolute;top:5px;right:5px;background:rgba(247,243,237,.88);border:none;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:13px;opacity:0;transition:opacity .2s;color:var(--muted)}
.panel-photo:hover .panel-photo-like,.panel-photo-like.on{opacity:1}
.panel-photo-like.on{color:var(--red)}
.panel-photo-move{position:absolute;bottom:5px;right:5px;background:rgba(247,243,237,.9);border:none;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:12px;opacity:0;transition:opacity .2s;cursor:pointer;color:var(--ink)}
.panel-photo:hover .panel-photo-move{opacity:1}
.panel-photo-dest{position:absolute;bottom:0;left:0;right:0;background:rgba(28,20,10,.6);color:var(--cream);font-size:12.5px;font-family:var(--sans);padding:4px 6px;transform:translateY(100%);transition:transform .2s}
.panel-photo:hover .panel-photo-dest{transform:translateY(0)}
.panel-photo-arch-actions{position:absolute;top:5px;right:5px;display:flex;flex-direction:column;gap:3px}
.arch-btn{border:none;color:white;padding:3px 6px;font-size:12px;cursor:pointer;font-family:var(--sans)}
.panel-pinned-label{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--red);font-family:var(--sans);margin:0 0 8px;font-weight:600}
.panel-empty{font-size:13px;color:var(--muted);text-align:center;padding:32px 0}


/* APP */
#app{display:none;min-height:100vh;flex-direction:column}
#app.visible{display:flex}
header{position:sticky;top:0;z-index:200;background:rgba(247,243,237,.97);backdrop-filter:blur(12px)}
.header-inner{max-width:980px;margin:0 auto;padding:0 20px}
.header-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:56px}
.hdr-left{justify-self:start}.hdr-right{justify-self:end}
.header-brand{text-align:center;cursor:pointer}
.brand-name{font-family:var(--sans);font-size:24px;font-weight:700;color:var(--ink);line-height:1}
.header-btn{background:none;border:none;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:5px;width:44px;height:44px;margin-right:-10px;transition:color .2s;position:relative}
.header-btn:hover{color:var(--ink)}
.hdr-back{display:none;align-items:center;gap:6px;white-space:nowrap;background:none;border:none;color:var(--ink);font-family:var(--sans);font-size:13px;min-height:44px;padding:0 10px 0 0}
.hdr-back.show{display:flex}
.hdr-back .chev{font-size:24px;line-height:1;margin-top:-3px;color:var(--muted)}
.panel-badge{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;width:14px;height:14px;border-radius:50%;font-size:8px;display:none;align-items:center;justify-content:center;font-family:sans-serif}
.panel-badge.show{display:flex}
main{max-width:980px;margin:0 auto;padding:var(--section-pad);width:100%;flex:1}

/* CAMERA DOCK — camera only on the home screen; All photos / Camera / Mood board inside each area */
#camera-dock{position:fixed;bottom:0;left:0;right:0;z-index:150;background:linear-gradient(to top,rgba(247,243,237,.98) 60%,rgba(247,243,237,0));display:flex;justify-content:center;align-items:flex-end;padding:26px 0 calc(14px + env(safe-area-inset-bottom));gap:30px;pointer-events:none}
#camera-dock .cam-wrap{pointer-events:auto}
#camera-dock.solo .cam-btn{width:68px;height:68px}
.cam-wrap{display:flex;flex-direction:column;align-items:center;gap:5px}
.cam-btn{width:54px;height:54px;border-radius:50%;background:var(--ink);border:3px solid var(--cream);outline:1px solid var(--ink);display:flex;align-items:center;justify-content:center;color:var(--cream);box-shadow:0 4px 20px rgba(28,20,10,.22);transition:transform .2s,box-shadow .2s;touch-action:manipulation}
.cam-btn:active{transform:scale(.96)}
.cam-btn:hover{transform:scale(1.07)}
.cam-btn.mood{background:var(--gold)}
.cam-btn.photos{background:var(--green)}
.cam-label{font-size:8px;color:var(--muted);font-family:var(--sans)}
#file-input,#file-input-camera,#fp-file-input,#rm-tile-input,#closet-cam,#closet-lib{display:none}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(28,20,10,.52);backdrop-filter:blur(8px);z-index:500;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-box{background:var(--cream);max-width:540px;width:100%;max-height:92vh;overflow-y:auto;padding:32px 36px;animation:modalIn .22s ease;border-top:3px solid var(--ink)}
@keyframes modalIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px}
.modal-title{font-family:var(--sans);font-size:20px;font-weight:700;color:var(--ink);}
.modal-close{background:none;border:none;color:var(--muted);font-size:24px;line-height:1;margin-left:16px;padding:0;font-family:serif}
.modal-close:hover{color:var(--ink)}
.modal-preview{width:100%;max-height:240px;object-fit:cover;margin-bottom:16px;border:1px solid var(--bone)}
.modal-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}

/* SECTION */
.section-rule{padding-top:4px;margin-bottom:22px;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px}
.section-title{font-family:var(--sans);font-size:30px;font-weight:600;color:var(--ink);letter-spacing:0;line-height:1.1}
.section-sub{font-family:var(--sans);font-size:13px;color:var(--muted);margin-top:4px}
/* Sub-menus wrap onto extra lines instead of scrolling sideways (phone-friendly). */
.room-tabs-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.room-tab{background:none;border:1px solid var(--bone);padding:9px 15px;font-family:var(--sans);font-size:12.5px;color:var(--muted);transition:all .2s}
.room-tab.active{background:var(--ink);border-color:var(--ink);color:var(--cream)}
.room-tab.drag-over{border-color:var(--gold)!important;color:var(--gold)!important}
.room-tab[draggable="true"]{cursor:grab;user-select:none}
.drag-handle{display:none}

/* ROOM SUB-TABS (segmented) */
.room-sub-tabs{display:flex;border:1px solid var(--bone);margin-bottom:18px}
.room-sub-tab{flex:1;background:none;border:none;border-right:1px solid var(--bone);padding:10px 6px;font-family:var(--sans);font-size:12.5px;color:var(--muted);transition:all .2s}
.room-sub-tab:last-child{border-right:none}
.room-sub-tab.active{background:var(--ink);color:var(--cream)}

/* FLOOR PLAN */
.fp-container{position:relative;width:100%;cursor:crosshair;user-select:none;border:1px solid var(--bone);overflow:hidden;background:var(--bone)}
.fp-img{width:100%;display:block;pointer-events:none}
.fp-marker{position:absolute;width:30px;height:30px;border-radius:50%;background:var(--ink);border:2px solid var(--cream);box-shadow:0 2px 10px rgba(28,20,10,.35);transform:translate(-50%,-50%);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--cream);font-family:var(--sans);font-size:12px;font-weight:700;transition:transform .2s,background .2s;z-index:5}
.fp-marker:hover{transform:translate(-50%,-50%) scale(1.2);background:var(--gold)}
.fp-label{position:absolute;top:calc(100% + 5px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--cream);font-size:12.5px;font-family:var(--sans);padding:3px 8px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .2s}
.fp-marker:hover .fp-label{opacity:1}
.fp-del{position:absolute;top:-5px;right:-5px;width:15px;height:15px;border-radius:50%;background:var(--red);border:none;color:white;font-size:12.5px;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s;cursor:pointer}
.fp-marker:hover .fp-del{opacity:1}

/* MOOD BOARD SWATCHES */
.mb-swatch-wrap{position:relative;display:inline-flex;flex-direction:column;align-items:center}
.mb-swatch{width:52px;height:52px;border:1px solid rgba(28,20,10,.1);cursor:pointer;transition:transform .2s}
.mb-swatch:hover{transform:scale(1.06)}
.mb-swatch-del{position:absolute;top:-5px;right:-5px;background:var(--red);border:none;color:white;width:15px;height:15px;border-radius:50%;font-size:12.5px;cursor:pointer;opacity:0;transition:opacity .2s;display:flex;align-items:center;justify-content:center}
.mb-swatch-wrap:hover .mb-swatch-del{opacity:1}
.mb-swatch-label{font-size:12.5px;color:var(--muted);text-align:center;margin-top:3px;font-family:var(--sans);max-width:52px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.color-picker-input{width:100%;height:48px;border:1px solid var(--bone);cursor:pointer;margin-bottom:14px;padding:2px}
.ral-row{display:flex;gap:8px;align-items:flex-start;margin-bottom:6px}
.ral-preview-box{width:44px;height:44px;border:1px solid var(--bone);flex-shrink:0;transition:background .2s}

/* BUDGET */
.budget-block{background:var(--bone);padding:18px 22px;margin-bottom:22px;border-left:3px solid var(--ink)}
.budget-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.budget-label{font-size:12px;color:var(--muted);font-family:var(--sans);font-weight:600}
.budget-amount{font-family:var(--sans);font-size:28px;color:var(--ink)}
.budget-amount.over{color:var(--red)}
.bar-track{height:2px;background:rgba(28,20,10,.12);margin-bottom:6px}
.bar-fill{height:100%;background:var(--ink);transition:width .6s}
.bar-fill.over{background:var(--red)}
.bar-note{font-family:var(--sans);font-size:12.5px;color:var(--muted)}
.bar-note.over{color:var(--red)}

/* PHOTO GRID */
.photo-grid{columns:2 180px;gap:12px;margin-top:16px}
.photo-card{break-inside:avoid;margin-bottom:12px;position:relative;overflow:hidden;background:var(--bone);border:1px solid var(--bone);transition:box-shadow .2s}
.photo-card:hover{box-shadow:0 4px 20px rgba(28,20,10,.12)}
.photo-card img{width:100%;display:block;transition:transform .5s;cursor:pointer}
.photo-card:hover img{transform:scale(1.04)}
.photo-card-actions{position:absolute;top:7px;right:7px;display:flex;flex-direction:column;gap:4px;opacity:0;transition:opacity .2s}
.photo-card:hover .photo-card-actions{opacity:1}
.img-btn{width:26px;height:26px;border:none;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);transition:all .2s;cursor:pointer}
.img-btn.default{background:rgba(247,243,237,.9);color:var(--muted)}
.img-btn.liked{background:rgba(168,32,32,.88);color:var(--cream)}
.img-btn.del{background:rgba(168,32,32,.88);color:var(--cream)}
.img-btn.arch{background:rgba(247,243,237,.88);color:var(--muted)}
.img-btn.arch:hover{background:rgba(28,20,10,.7);color:var(--cream)}
.photo-note{padding:10px 12px 12px;font-size:13px;color:var(--ink);line-height:1.55;background:var(--cream);border-top:1px solid var(--bone)}
.photo-link{display:block;padding:6px 12px;font-size:12.5px;color:var(--muted);font-family:var(--sans);background:var(--bone);border-top:1px solid rgba(28,20,10,.07);text-decoration:none;text-overflow:ellipsis;overflow:hidden;white-space:nowrap}
.photo-link:hover{color:var(--ink)}
.photo-price{padding:4px 12px 10px;font-family:var(--sans);font-size:16px;color:var(--green)}
.liked-dot{position:absolute;top:7px;left:7px;width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px rgba(247,243,237,.8)}

/* ITEMS */
.item-row{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--bone)}
.item-thumb{width:52px;height:52px;object-fit:cover;flex-shrink:0;border:1px solid var(--bone)}
.item-thumb-ph{width:52px;height:52px;background:var(--bone);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--warm);font-size:22px}
.item-body{flex:1;min-width:0}
.item-name{font-size:15px;color:var(--ink);margin-bottom:2px}
.item-store{font-size:12px;color:var(--muted);font-family:var(--sans);margin-bottom:4px}
.item-link{font-size:12.5px;color:var(--muted);text-decoration:underline;word-break:break-all}
.item-link:hover{color:var(--ink)}
.item-price{font-family:var(--sans);font-size:18px;color:var(--ink);flex-shrink:0;white-space:nowrap}
.icon-btn{background:none;border:none;color:var(--muted);padding:3px;display:flex;transition:color .2s}
.icon-btn:hover{color:var(--red)}
.cat-badge{font-size:12.5px;font-family:var(--sans);padding:2px 7px;border:1px solid var(--bone);color:var(--muted);margin-bottom:3px;display:inline-block}

/* MOOD BOARD */
.mood-board{min-height:300px;background:var(--bone);padding:20px;display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px;border:2px dashed var(--warm)}
.mood-board.empty-board{align-items:center;justify-content:center}
.mood-tile{position:relative;overflow:hidden;border:1px solid var(--bone)}
.mood-tile img{display:block;width:100%;height:100%;object-fit:cover}
.mood-tile.size-sm{width:130px;height:130px}
.mood-tile.size-md{width:200px;height:150px}
.mood-tile.size-lg{width:280px;height:200px}
.mood-tile .tile-note{position:absolute;bottom:0;left:0;right:0;background:rgba(28,20,10,.6);color:var(--cream);font-size:12.5px;padding:5px 7px;transform:translateY(100%);transition:transform .2s}
.mood-tile:hover .tile-note{transform:translateY(0)}
.mood-palette{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.palette-swatch{width:32px;height:32px;border:2px solid transparent;transition:border-color .2s}
.palette-swatch:hover{border-color:var(--ink)}

/* RECIPES */
.recipe-grid{columns:2 240px;gap:14px;margin-top:16px}
.recipe-card{break-inside:avoid;margin-bottom:14px;background:var(--cream);border:1px solid var(--bone);overflow:hidden}
.recipe-img{width:100%;max-height:200px;object-fit:cover;display:block;cursor:pointer}
.recipe-body{padding:14px 16px 16px}
.recipe-tag{display:inline-block;font-size:12.5px;border:1px solid var(--bone);padding:2px 8px;margin-right:5px;margin-bottom:8px;color:var(--muted);font-family:var(--sans)}
.recipe-title{font-family:var(--sans);font-size:18px;font-weight:600;color:var(--ink);margin-bottom:6px}
.recipe-text{font-size:13px;color:var(--muted);line-height:1.6;white-space:pre-wrap}
.recipe-section-label{font-size:12px;color:var(--muted);font-family:var(--sans);font-weight:600;margin-bottom:10px}
.serving-adjust{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.serving-btn{width:26px;height:26px;border:1px solid var(--bone);background:var(--bone);color:var(--ink);font-size:15px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;font-family:var(--sans)}
.serving-btn:hover{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.serving-count{font-family:var(--sans);font-size:13px;color:var(--ink);min-width:78px;text-align:center}
.ingredient-list{list-style:none;padding:0;margin:0}
.ingredient-list li{font-size:14px;color:var(--ink);padding:7px 0 7px 14px;border-bottom:1px solid var(--bone);position:relative}
.ingredient-list li::before{content:'';position:absolute;left:0;top:16px;width:4px;height:4px;border-radius:50%;background:var(--warm)}
.method-list{padding-left:22px;margin:0}
.method-list li{font-size:14px;line-height:1.7;color:var(--ink);padding:8px 0;border-bottom:1px solid var(--bone)}
.method-list li::marker{font-family:var(--sans);font-weight:700;color:var(--gold)}
.cook-toggle{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--bone);background:var(--cream);color:var(--muted);font-family:var(--sans);font-size:12px;padding:7px 14px;cursor:pointer;transition:all .2s;margin-top:12px}
.cook-toggle.on{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.cook-toggle-dot{width:7px;height:7px;border-radius:50%;background:var(--warm);flex-shrink:0}
.cook-toggle.on .cook-toggle-dot{background:var(--gold)}

/* MUSIC */
.song-row{display:flex;align-items:flex-start;gap:12px;padding:11px 0;border-bottom:1px solid var(--bone)}
.song-num{font-family:var(--sans);font-size:18px;color:var(--warm);min-width:26px;text-align:right;flex-shrink:0;padding-top:2px}
.song-body{flex:1;min-width:0}
.song-title{font-size:15px;color:var(--ink);margin-bottom:2px}
.song-artist{font-size:12.5px;color:var(--muted);font-family:var(--sans)}
.song-note{font-size:12px;color:var(--muted);margin-top:3px}
.song-link-btn{display:inline-flex;align-items:center;gap:4px;background:none;border:1px solid var(--bone);color:var(--muted);font-family:var(--sans);font-size:12px;padding:5px 10px;text-decoration:none;transition:all .2s;flex-shrink:0;align-self:center;white-space:nowrap}
.song-link-btn:hover{background:var(--ink);color:var(--cream);border-color:var(--ink)}

/* CLOSET */
.cl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.cl-card{position:relative;background:var(--bone);border:1px solid rgba(28,20,10,.07);aspect-ratio:4/5;cursor:pointer;overflow:hidden}
.cl-card img{width:100%;height:100%;object-fit:contain;padding:8px 8px 22px;display:block;transition:transform .25s}
.cl-card:hover img{transform:scale(1.04)}
.cl-fav,.cl-del{position:absolute;top:4px;width:26px;height:26px;border:none;background:rgba(247,243,237,.88);color:var(--muted);font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:serif}
.cl-fav{right:4px}.cl-del{left:4px;font-size:17px}
.cl-fav.on{color:var(--red)}.cl-del:hover{color:var(--red)}
.cl-cap{position:absolute;left:0;right:0;bottom:0;padding:12px 7px 5px;background:linear-gradient(transparent,rgba(237,228,213,.95) 60%);color:var(--ink);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--sans);font-weight:600;}
.cl-checker{background-color:#fbf8f2;background-image:linear-gradient(45deg,#e9e2d6 25%,transparent 25%),linear-gradient(-45deg,#e9e2d6 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e9e2d6 75%),linear-gradient(-45deg,transparent 75%,#e9e2d6 75%);background-size:16px 16px;background-position:0 0,0 8px,8px -8px,-8px 0;display:flex;justify-content:center;align-items:center;padding:8px;border:1px solid var(--bone);min-height:120px}
.cl-checker canvas{max-width:100%;max-height:min(440px,58vh);display:block}
.cl-checker canvas.editing{touch-action:none;cursor:crosshair}
.cl-brushrow{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.cl-brushrow input{flex:1}
.cl-dotbox{width:64px;height:64px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--bone)}
.cl-dot{display:block;border-radius:50%;background:rgba(168,32,32,.35);border:1px solid var(--red)}
.cl-check{display:flex;align-items:center;gap:8px;font-size:14px;margin:14px 0 8px;cursor:pointer}
.cl-hint{font-size:12px;color:var(--muted);line-height:1.5;margin:4px 0 14px}
.cl-detail-img{background:var(--bone);display:flex;justify-content:center;padding:12px}
.cl-detail-img img{max-width:100%;max-height:300px;object-fit:contain;display:block}
.cl-facts{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;margin:16px 0 18px;font-size:14px}
.cl-facts span{display:block;font-size:12.5px;color:var(--muted);font-family:var(--sans);margin-bottom:2px}
.mini-board{position:relative;width:100%;aspect-ratio:3/4;background:#fbf8f2;overflow:hidden}
.mini-board img{position:absolute;height:auto;display:block;pointer-events:none}
.of-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.of-grid.sm{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin-top:10px}
.of-card{background:var(--cream);border:1px solid var(--bone)}
.of-body{padding:10px 12px 12px}
.of-name{font-family:var(--sans);font-size:15px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.of-meta{font-size:12.5px;color:var(--muted);}
.of-tag{font-size:12.5px;color:var(--plum);font-family:var(--sans);font-weight:600}
.of-pick{cursor:pointer;border:1px solid var(--bone);padding:4px;background:var(--cream)}
.of-pick:hover{border-color:var(--ink)}
.of-pick.on{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.ob-board{position:relative;width:100%;max-width:440px;aspect-ratio:3/4;margin:0 auto 12px;background:#fbf8f2;border:1px solid var(--warm);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.ob-item{position:absolute;cursor:grab;touch-action:none}
.ob-item img{width:100%;height:auto;display:block;pointer-events:none;-webkit-user-drag:none}
.ob-item.sel{outline:1px dashed var(--gold);outline-offset:1px}
.ob-handle{display:none;position:absolute;right:-9px;bottom:-9px;width:22px;height:22px;border-radius:50%;background:var(--gold);border:2px solid var(--cream);cursor:nwse-resize;touch-action:none}
.ob-item.sel .ob-handle{display:block}
.ob-tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:14px}
.ob-strip{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;-webkit-overflow-scrolling:touch}
.ob-strip button{flex:0 0 76px;height:76px;background:var(--bone);border:1px solid transparent;padding:4px;cursor:pointer}
.ob-strip button:hover{border-color:var(--ink)}
.ob-strip img{width:100%;height:100%;object-fit:contain;display:block}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:8px}
.cal-title{font-family:var(--sans);font-size:20px;font-weight:700;}
.cal-nav{width:34px;height:34px;border:1px solid var(--bone);background:var(--cream);color:var(--ink);font-size:18px;cursor:pointer}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-dow{font-size:12.5px;color:var(--muted);text-align:center;font-family:var(--sans);padding-bottom:4px}
.cal-cell{position:relative;aspect-ratio:3/4;background:var(--cream);border:1px solid var(--bone);cursor:pointer;overflow:hidden;padding:0;display:block}
.cal-cell.blank{background:transparent;border-color:transparent;cursor:default}
.cal-cell.today{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.cal-cell .mini-board{position:absolute;inset:0;aspect-ratio:auto;height:100%;background:transparent}
.cal-num{position:absolute;top:2px;left:4px;font-size:12px;color:var(--muted);z-index:50;font-family:var(--sans);font-weight:700}
.cal-badge{position:absolute;bottom:2px;left:3px;z-index:50;font-size:12.5px;background:var(--ink);color:var(--cream);padding:0 4px;font-family:var(--sans)}
.cal-worn{position:absolute;bottom:1px;right:3px;z-index:50;font-size:12.5px;color:var(--green);font-weight:700}
.cal-txt{position:absolute;inset:16px 3px 3px;font-size:12.5px;color:var(--muted);overflow:hidden;line-height:1.2;text-align:left}
.sh-row{margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--bone)}
.sh-row-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.sh-stage{display:flex;align-items:center;gap:6px}
.sh-arrow{width:34px;height:34px;border:1px solid var(--bone);background:var(--cream);color:var(--ink);font-size:18px;cursor:pointer;flex-shrink:0}
.sh-slot{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:8px;min-height:130px}
.sh-main{width:52%;max-width:150px;aspect-ratio:1;object-fit:contain;display:block}
.sh-side{width:20%;max-width:58px;aspect-ratio:1;object-fit:contain;opacity:.35;display:block}
.sh-name{text-align:center;font-size:13px;color:var(--muted);margin-top:2px}
.st-tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:24px}
.st-tile{background:var(--bone);padding:14px 14px 12px;border-top:2px solid var(--ink)}
.st-num{font-family:var(--sans);font-size:26px;font-weight:700;line-height:1}
.st-lbl{font-size:12.5px;color:var(--muted);margin-top:6px;font-family:var(--sans)}
.st-h{font-family:var(--sans);font-size:12.5px;color:var(--muted);font-weight:600;margin:6px 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.st-bars{margin-bottom:26px}
.st-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.st-bar-thumb{width:36px;height:36px;object-fit:contain;background:var(--bone);flex-shrink:0}
.st-bar-main{flex:1;min-width:0}
.st-bar-label{font-size:13px;color:var(--ink);display:flex;justify-content:space-between;gap:8px}
.st-bar-label span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-bar-right{color:var(--muted);font-size:12px;white-space:nowrap;flex-shrink:0}
.st-bar-track{height:7px;background:var(--bone);margin-top:4px}
.st-bar-fill{height:100%;background:var(--ink)}
.st-bar-fill.green{background:var(--green)}.st-bar-fill.red{background:var(--red)}.st-bar-fill.plum{background:var(--plum)}.st-bar-fill.gold{background:var(--gold)}
.pk-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--bone);cursor:pointer}
.pk-row input[type=checkbox]{width:18px;height:18px;flex-shrink:0;accent-color:var(--ink)}
.pk-thumb{width:44px;height:44px;object-fit:contain;background:var(--bone);flex-shrink:0}
.cl-mini56{width:48px;flex-shrink:0;border:1px solid var(--bone)}
#cl-toast{position:fixed;left:50%;bottom:112px;transform:translateX(-50%);background:var(--ink);color:var(--cream);padding:10px 18px;font-family:var(--sans);font-size:12px;z-index:600;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
#cl-toast.show{opacity:1}
.dash-card:last-child:nth-child(odd){grid-column:1/-1}

/* PANEL TABS */
.panel-mode-tabs{display:flex;border-bottom:1px solid var(--bone)}
.panel-mode-tab{flex:1;background:none;border:none;border-bottom:2px solid transparent;padding:10px 0;font-family:var(--sans);font-size:12px;color:var(--muted);margin-bottom:-1px;transition:all .2s;cursor:pointer}
.panel-mode-tab.active{border-bottom-color:var(--ink);color:var(--ink)}

/* LINK ITEMS */
.link-item{padding:12px 0;border-bottom:1px solid var(--bone);display:flex;align-items:flex-start;gap:10px}
.link-item-icon{font-size:18px;flex-shrink:0;margin-top:1px}
.link-item-body{flex:1;min-width:0}
.link-item-title{font-size:14px;color:var(--ink);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link-item-url{font-size:12.5px;color:var(--muted);text-decoration:none;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link-item-url:hover{color:var(--ink)}
.link-item-label{font-size:12.5px;color:var(--warm);font-family:var(--sans);margin-top:3px}

/* NOTES BUTTON */
.notes-btn{background:none;border:1px solid var(--bone);color:var(--muted);font-family:var(--sans);font-size:12px;padding:5px 11px;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:5px;vertical-align:middle}
.notes-btn:hover,.notes-btn.has-notes{border-color:var(--gold);color:var(--gold)}
.photo-card.pressing img{transform:scale(.97);opacity:.75;transition:none}

/* UTILS */
.field-label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600}
.field-input{width:100%;border:none;border-bottom:1px solid var(--warm);padding:9px 2px;color:var(--ink);font-size:15px;outline:none;margin-bottom:18px;border-radius:0;transition:border-color .2s}
.field-input:focus{border-bottom-color:var(--ink)}
textarea.field-input{resize:vertical;min-height:80px;border:1px solid var(--warm);padding:9px}
select.field-input{appearance:none}
.btn-solid{background:var(--ink);border:none;color:var(--cream);font-family:var(--sans);font-size:13px;padding:13px 28px;width:100%;transition:opacity .2s}
.btn-solid:hover{opacity:.82}
.btn-solid.sm{padding:9px 20px;width:auto;font-size:12px}
.btn-solid.green{background:var(--green)}
.btn-solid.teal{background:var(--teal)}
.btn-ghost{background:transparent;border:1px solid rgba(28,20,10,.22);color:var(--muted);font-family:var(--sans);font-size:12.5px;padding:7px 16px;transition:all .2s}
.btn-ghost:hover{background:rgba(28,20,10,.08);border-color:var(--ink);color:var(--ink)}
.btn-ghost.danger{border-color:var(--red);color:var(--red)}
.btn-ghost.danger:hover{background:rgba(168,32,32,.08)}
.tag-pill{background:transparent;border:1px solid rgba(28,20,10,.18);color:var(--muted);font-family:var(--sans);font-size:12px;padding:4px 12px;transition:all .2s}
.tag-pill:hover,.tag-pill.active{background:rgba(28,20,10,.08);border-color:var(--ink);color:var(--ink)}
.tag-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.empty{font-size:15px;color:var(--muted);padding:48px 0;text-align:center}
.empty-icon{font-size:36px;margin-bottom:10px;opacity:.4}
.flex-between{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.flex-center{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mb14{margin-bottom:14px}
.divider{border:none;border-top:1px solid var(--bone);margin:20px 0}
@media(max-width:520px){.photo-grid,.recipe-grid{columns:1}.modal-box{padding:22px 18px}.section-title{font-size:26px}.room-tabs-row{gap:6px}.room-tab{padding:9px 11px;font-size:12.5px;}}

/* DASHBOARD */
/* HOME SCREEN & AREAS */
.empty-icon{display:none}
.home-greet{font-size:12px;color:var(--warm);font-family:var(--sans);margin:6px 0 22px}
.home-tiles{display:flex;flex-direction:column;gap:14px;max-width:560px}
.home-tile{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;text-align:left;background:var(--cream);border:1px solid var(--bone);border-top:2px solid var(--ink);padding:26px 20px;cursor:pointer;font-family:inherit;color:var(--ink);transition:background .2s}
.home-tile:active,.home-tile:hover{background:var(--bone)}
.home-tile-num{font-family:var(--sans);font-size:12px;font-weight:600;margin-bottom:12px}
.home-tile-name{font-family:var(--sans);font-size:27px;font-weight:700;line-height:1}
.home-tile-sub{font-size:12px;color:var(--muted);margin-top:9px}
.area-list{border-top:1px solid var(--bone);max-width:560px}
.area-row{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:20px 2px;background:none;border:none;border-bottom:1px solid var(--bone);text-align:left;cursor:pointer;font-family:inherit;color:var(--ink)}
.area-row:active{background:var(--bone)}
.area-row-title{font-family:var(--sans);font-size:22px;font-weight:600;}
.area-row-meta{font-size:12px;color:var(--muted);margin-top:3px}
.area-chev{font-size:26px;color:var(--warm);font-family:var(--sans);line-height:1}
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:28px}
@media(max-width:480px){.dash-grid{grid-template-columns:1fr 1fr;gap:10px}}
.dash-card{background:var(--cream);border:1px solid var(--bone);border-top:2px solid var(--ink);padding:20px 16px 18px;cursor:pointer;transition:all .22s;position:relative}
.dash-card:hover{background:var(--bone);box-shadow:0 4px 20px rgba(28,20,10,.1)}
.dash-card:active{opacity:.82}
.dash-card-num{font-family:var(--sans);font-size:12px;font-weight:600;margin-bottom:14px;opacity:.75}
.dash-card-name{font-family:var(--sans);font-size:20px;font-weight:700;color:var(--ink);line-height:1;margin-bottom:7px}
.dash-card-sub{font-size:12.5px;color:var(--muted);font-family:var(--sans)}
.dash-card-empty{font-size:12.5px;color:var(--warm);font-family:var(--sans)}
#app.has-wallpaper{background:rgba(247,243,237,.87)}
.dash-recent-row{padding:10px 0;border-bottom:1px solid var(--bone);display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.dash-recent-label{font-size:14px;color:var(--ink)}
.dash-recent-meta{font-size:12px;color:var(--muted);font-family:var(--sans);margin-top:2px}
.dash-recent-tag{font-size:12.5px;color:var(--warm);font-family:var(--sans);white-space:nowrap;flex-shrink:0;margin-top:2px}

/* ═══ EDITORIAL LAYER ═══
   Serif (Cormorant) is for large display type only; everything small is a clean sans (DM Sans) so it never turns curly.
   Hairline dividers instead of boxes, text-link menus, pill buttons, flat surfaces. Same palette as before. */
:root{--line:#dccfba}
body{font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::after{display:none}
.auth-deco,.masthead-title,.brand-name,.section-title,.modal-title,.panel-title,.cal-title,.budget-amount,.home-tile-name,.area-row-title,.st-num,.st-h,.recipe-title{font-family:var(--serif);font-variant-numeric:lining-nums;font-feature-settings:'lnum' 1}
.masthead-title{font-weight:600}
.masthead-sub,.masthead-tagline{font-size:13px}
/* header */
.brand-name{font-size:21px;font-weight:600;letter-spacing:.2em;padding-left:.2em}
.hdr-back{font-size:15px;color:var(--muted);font-weight:400}
.hdr-back .chev{color:var(--muted)}
/* titles */
.section-title{font-size:38px;font-weight:500;letter-spacing:-.01em;line-height:1.05}
.section-sub{font-size:14px;margin-top:6px}
.section-rule{margin-bottom:20px}
.st-h{font-size:23px;font-weight:500;color:var(--ink);margin:22px 0 10px;line-height:1.15}
.st-h .tag-pill{font-family:var(--sans)}
.st-h .of-meta,.st-h span.of-meta{font-family:var(--sans)}
/* menus = text links with a hairline under the active one */
.tag-row{gap:6px 18px;margin-bottom:16px}
.tag-pill{background:none;border:none;border-bottom:1px solid transparent;border-radius:0;padding:4px 0;font-size:14.5px;color:var(--muted)}
.tag-pill:hover{background:none;border-color:transparent;color:var(--ink)}
.tag-pill.active{background:none;color:var(--ink);border-bottom-color:var(--ink)}
.room-tabs-row{gap:6px 20px;margin-bottom:18px}
.room-tab{background:none;border:none;border-bottom:1px solid transparent;border-radius:0;padding:4px 0;font-size:16px;color:var(--muted)}
.room-tab.active{background:none;color:var(--ink);border-bottom-color:var(--ink)}
.room-tab.drag-over{border-bottom-color:var(--gold)!important}
.room-sub-tabs{border:none;border-bottom:1px solid var(--line);gap:24px;margin-bottom:18px}
.room-sub-tab{flex:none;border:none;border-bottom:1px solid transparent;margin-bottom:-1px;padding:9px 0;font-size:15px;color:var(--muted)}
.room-sub-tab.active{background:none;color:var(--ink);border-bottom-color:var(--ink)}
/* buttons & form fields */
.btn-solid{font-size:14.5px;font-weight:500;padding:14px 26px;border-radius:999px}
.btn-solid.sm{padding:10px 20px;font-size:14px}
.btn-ghost{border:1px solid var(--line);color:var(--ink);font-size:13.5px;font-weight:500;padding:8px 16px;border-radius:999px}
.btn-ghost:hover{background:var(--bone);border-color:var(--warm);color:var(--ink)}
.btn-ghost.danger{color:var(--red);border-color:rgba(168,32,32,.32)}
.notes-btn{font-size:13.5px;font-weight:500;border-color:var(--line);color:var(--ink);padding:8px 16px;border-radius:999px}
.notes-btn:hover,.notes-btn.has-notes{border-color:var(--gold);color:var(--gold)}
.cook-toggle{font-size:13.5px;border-radius:999px;border-color:var(--line);padding:8px 16px}
.song-link-btn{font-size:13px;border-radius:999px;border-color:var(--line);color:var(--ink);padding:6px 14px}
.field-label{font-size:13px;font-weight:500;color:var(--muted);margin-bottom:6px}
.field-input{font-size:16px;border-bottom:1px solid var(--line)}
textarea.field-input{border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.serving-btn{border-radius:50%;border:1px solid var(--line);background:none;width:32px;height:32px}
.serving-btn:hover{border-color:var(--ink)}
.serving-count{font-size:14.5px}
/* surfaces: flat, softly rounded, hairlines */
.recipe-card,.photo-card,.of-card,.cl-card,.panel-photo,.mood-tile,.of-pick,.cal-cell,.ob-board,.fp-container,.cl-checker,.cl-detail-img,.cl-dotbox,.st-tile,.mood-board{border-radius:8px}

// ── STATE ──
let currentUser=null,currentSection='home',capturedDataURL=null;
let panelFilter='all',panelMode='photos',homeView='rooms',activeRoomTab='overview';
let activeDayOutId=null,dragRoomIdx=null,activeMusicPlaylistId=null;

function getStore(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
// Browsers cap localStorage (~5MB). A failed write used to vanish silently, so the user thought data was saved when it wasn't.
let _storageWarnAt=0;
function storageFull(what){
  if(Date.now()-_storageWarnAt<20000)return;_storageWarnAt=Date.now();
  alert((what||"MAISON couldn't save that — this device's storage for the app is full.")+"\n\nFree up space by deleting photos you no longer need (Settings shows how much is used). Your data already in Google Drive is not affected.");
}
function setStore(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){storageFull();return false;}}
function userData(k,d){return getStore(`maison_${currentUser}_${k}`,d);}
function saveData(k,v){
  const ok=setStore(`maison_${currentUser}_${k}`,v);
  if(!ok)return false;   // nothing was stored, so don't mark a newer write or push stale data to Drive
  try{localStorage.setItem(`maison_${currentUser}_lastwrite`,String(Date.now()));}catch(e){}
  scheduleDriveSync();scheduleBkBackup();return true;
}
function escHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

// ── PHOTO PROCESSING & LOCAL MEDIA STORE ──
// Root cause of the old "out of storage" errors: full-res camera photos (often
// several MB each) were stored as base64 directly in localStorage, which browsers
// cap at ~5MB regardless of device/Drive space. Now: a small thumbnail (the only
// thing that still lives in localStorage/JSON as `img`) is generated for display,
// and the full-res version is stored as a blob in IndexedDB, mirrored to the Drive
// appDataFolder as an individual file so it still syncs across devices.
function loadImageFromDataURL(dataURL){return new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=dataURL;});}
function scaleDims(w,h,max){if(w>max||h>max){const s=max/Math.max(w,h);return{w:Math.round(w*s),h:Math.round(h*s)};}return{w,h};}
function drawToCanvas(im,w,h){const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);return c;}
function canvasDataURL(canvas,q){return canvas.toDataURL('image/jpeg',q);}
function canvasBlob(canvas,q){return new Promise(res=>canvas.toBlob(b=>res(b),'image/jpeg',q));}
function dataURLtoBlob(dataURL){
  const[header,data]=dataURL.split(',');const mime=(header.match(/:(.*?);/)||[])[1]||'image/jpeg';
  const bin=atob(data);const arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
  return new Blob([arr],{type:mime});
}
async function processPhotoDataURL(dataURL){
  const im=await loadImageFromDataURL(dataURL);
  const full=scaleDims(im.naturalWidth,im.naturalHeight,1600);
  const blob=await canvasBlob(drawToCanvas(im,full.w,full.h),.85)||dataURLtoBlob(dataURL);
  const thumb=makeThumb(im);
  return{thumb,blob};
}
// Inline thumbnail (what lives in localStorage and the synced JSON). ~30KB instead of ~70KB at 900px, so a
// 5MB browser limit holds ~170 photos rather than ~65. The full-size copy is in IndexedDB + Drive.
const THUMB_MAX=560,THUMB_Q=.62;
function makeThumb(im){const th=scaleDims(im.naturalWidth,im.naturalHeight,THUMB_MAX);return canvasDataURL(drawToCanvas(im,th.w,th.h),THUMB_Q);}
async function compressSingleImage(dataURL,maxDim,quality){
  try{const im=await loadImageFromDataURL(dataURL);const d=scaleDims(im.naturalWidth,im.naturalHeight,maxDim||1600);return canvasDataURL(drawToCanvas(im,d.w,d.h),quality||.8);}catch(e){return dataURL;}
}
const MEDIA_DB_NAME='maison_media',PHOTO_STORE='photos';
function mediaDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(MEDIA_DB_NAME,1);
    req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains(PHOTO_STORE))req.result.createObjectStore(PHOTO_STORE);};
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}
// Never throws: if the full-size copy can't be stored (device storage low) the thumbnail still saves, the user is told,
// and callers can check the boolean. (A throw here used to abort saves half-way and leave dialogs stuck.)
async function idbPutPhoto(id,blob){
  try{
    const db=await mediaDB();
    await new Promise((resolve,reject)=>{const tx=db.transaction(PHOTO_STORE,'readwrite');tx.objectStore(PHOTO_STORE).put(blob,id);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error);});
    return true;
  }catch(e){storageFull("The photo was saved, but its full-size copy couldn't be stored — this device is low on space.");return false;}
}
async function idbGetPhoto(id){const db=await mediaDB();return new Promise((resolve,reject)=>{const tx=db.transaction(PHOTO_STORE,'readonly');const rq=tx.objectStore(PHOTO_STORE).get(id);rq.onsuccess=()=>resolve(rq.result||null);rq.onerror=()=>reject(rq.error);});}

// On page load: pick up the access token Google sent back in the URL hash
function checkDriveRedirect(){
  if(!location.hash)return;
  const h=new URLSearchParams(location.hash.slice(1));
  if(h.get('state')!=='maison_drive')return;
  const err=h.get('error');
  if(err){

  }else if(h.get('access_token')){
    const exp=Date.now()+(parseInt(h.get('expires_in')||'3600',10)-60)*1000;
    localStorage.setItem('maison_drive_tok',JSON.stringify({tok:h.get('access_token'),exp}));
    sessionStorage.removeItem('maison_drive_err');
    sessionStorage.removeItem('maison_drive_tried');
  }
  history.replaceState(null,'',location.pathname+location.search);
}
function getDriveToken(){try{const t=JSON.parse(localStorage.getItem('maison_drive_tok')||'null');if(t&&t.exp>Date.now())return t.tok;}catch(e){}return null;}
function driveAuthRedirect(interactive){
  const p=new URLSearchParams({client_id:DRIVE_CLIENT_ID,redirect_uri:location.origin+location.pathname,response_type:'token',scope:DRIVE_SCOPE,state:'maison_drive',include_granted_scopes:'true'});
  if(currentUserEmail)p.set('login_hint',currentUserEmail);
  if(!interactive)p.set('prompt','none');
  location.href='https://accounts.google.com/o/oauth2/v2/auth?'+p.toString();
}
// Returns true if it navigated away to silently reconnect (so callers must not
// start another redirect this tick — a second location.href would clobber this one).
function driveBoot(){
  driveAccessToken=getDriveToken();
  if(driveAccessToken){
    localStorage.setItem(`maison_drive_on_${currentUser}`,'1');
    driveSyncNow(false);
    return false;
  }
  // Sync was on before but token expired — reconnect silently, once per session
  if(localStorage.getItem(`maison_drive_on_${currentUser}`)&&!sessionStorage.getItem('maison_drive_tried')){
    sessionStorage.setItem('maison_drive_tried','1');
    driveAuthRedirect(false);

  }

}

function disableDriveSync(){driveTokenInvalid();localStorage.removeItem(`maison_drive_on_${currentUser}`);if(driveSyncTimer){clearTimeout(driveSyncTimer);driveSyncTimer=null;}closeModal();openSettings();}
async function driveFetch(url,opts){

  if(res.status===403){let msg='';try{const j=await res.json();msg=(j.error&&j.error.message)||'';}catch(e){}throw new Error(msg||'Google Drive refused the request (403). Check the Drive API is enabled in Google Cloud Console.');}

async function driveSyncNow(manual){

    if(verdict!=='applied'&&verdict!=='insync')await syncToDrive();
    const failedPhotos=await syncPhotoFiles();
    lastSyncAt=Date.now();
    lastSyncError=failedPhotos?`${failedPhotos} photo${failedPhotos!==1?'s':''} couldn't be copied to Drive yet — they'll be retried on the next sync.`:null;
    if(manual){closeModal();alert('Synced successfully ✓');openSettings();}

async function loadFromDrive(){
  if(!driveAccessToken)return 'noauth';
  const auth={headers:{Authorization:'Bearer '+driveAccessToken}};
  const res=await driveFetch('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=name%3D%27maison_data.json%27&fields=files(id)',auth);
  const list=await res.json();
  const file=(list.files||[])[0];
  if(!file){driveFileId=null;return 'nofile';}
  driveFileId=file.id;
  const dr=await driveFetch(`https://www.googleapis.com/drive/v3/files/${file.id}?alt=media`,auth);
  const payload=await dr.json();
  if(!payload||!payload.keys)return 'nofile';
  const lwKey=`maison_${currentUser}_lastwrite`;
  const localAt=parseInt(localStorage.getItem(lwKey)||'0',10);
  const driveAt=payload.at||0;
  if(driveAt>localAt){
    // Drive copy is newer — replace local data with it. If it doesn't fit on this device the old local data is put
    // back and pushing to Drive is blocked, so a partial restore can never overwrite the complete copy in Drive.
    const prefix=`maison_${currentUser}_`;
    const oldEntries=Object.keys(localStorage).filter(k=>k.startsWith(prefix)).map(k=>[k,localStorage.getItem(k)]);
    oldEntries.forEach(([k])=>localStorage.removeItem(k));
    const written=[];let failed=false;
    for(const [k,v] of Object.entries(payload.keys)){
      try{localStorage.setItem(k,JSON.stringify(v));written.push(k);}catch(e){failed=true;break;}
    }
    if(failed){
      written.forEach(k=>localStorage.removeItem(k));
      oldEntries.forEach(([k,v])=>{try{localStorage.setItem(k,v);}catch(e){}});
      driveBlocked=true;
      storageFull("Your latest data in Google Drive is too big to load on this device, so syncing is paused to keep it safe.");
      throw new Error('Not enough storage on this device to load your Drive data — free up space, then tap Sync Now.');
    }
    try{localStorage.setItem(lwKey,String(driveAt));}catch(e){}
    showSection(currentSection);updatePanelBadge();
    migrateInlinePhotos().then(ch=>{if(ch)showSection(currentSection);}).catch(()=>{});   // shrink any big photos that arrived from an older device
    return 'applied';
  }
  return driveAt===localAt?'insync':'localnewer';
}
function scheduleDriveSync(){

  if(driveSyncTimer)clearTimeout(driveSyncTimer);

let driveBlocked=false;   // set when a Drive restore didn't fit on this device: never push local data over Drive
async function syncToDrive(){

  const keys={};
  const lwKey=`maison_${currentUser}_lastwrite`;
  Object.keys(localStorage).filter(k=>k.startsWith(`maison_${currentUser}_`)&&k!==lwKey).forEach(k=>{try{keys[k]=JSON.parse(localStorage.getItem(k));}catch(e){}});

async function uploadAppDataPhoto(id,blob){
  // Songs are big: above ~4MB use Drive's resumable upload (single PUT), falling back to multipart if the browser can't read the session URL.
  if(blob.size>4*1048576){
    const type=blob.type||'application/octet-stream';
    const init=await driveFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable',{method:'POST',headers:{Authorization:'Bearer '+driveAccessToken,'Content-Type':'application/json; charset=UTF-8','X-Upload-Content-Type':type,'X-Upload-Content-Length':String(blob.size)},body:JSON.stringify({name:photoFileName(id),parents:['appDataFolder']})});
    const loc=init.headers&&init.headers.get('Location');
    if(loc){await driveFetch(loc,{method:'PUT',headers:{'Content-Type':type},body:blob});return;}
  }
  const form=new FormData();
  form.append('metadata',new Blob([JSON.stringify({name:photoFileName(id),parents:['appDataFolder']})],{type:'application/json'}));
  form.append('file',blob,photoFileName(id));
  await driveFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:{Authorization:'Bearer '+driveAccessToken},body:form});
}
let photoSyncRunning=false,photoSyncAgain=false;
// Copies full-size photos between this device (IndexedDB) and Drive. Returns how many couldn't be transferred so
// the caller can tell the user (failures used to be swallowed). A photo added while a sync is running triggers a re-run.
async function syncPhotoFiles(){
  if(!driveAccessToken||!currentUser)return 0;
  if(photoSyncRunning){photoSyncAgain=true;return 0;}
  const ids=Array.from(new Set(referencedPhotoIds()));
  if(!ids.length)return 0;
  photoSyncRunning=true;let failed=0;
  try{
    const remote=await listRemotePhotos();
    const auth={headers:{Authorization:'Bearer '+driveAccessToken}};
    const audioIds=new Set(referencedAudioIds());
    for(const id of ids){
      const fn=photoFileName(id);
      if(audioIds.has(id))continue;   // songs are fetched on demand
      if(remote[fn]&&!(await idbGetPhoto(id))){
        try{const blob=await(await driveFetch(`https://www.googleapis.com/drive/v3/files/${remote[fn]}?alt=media`,auth)).blob();if(!(await idbPutPhoto(id,blob)))failed++;}catch(e){failed++;if(!driveAccessToken)break;}
      }
    }
    for(const id of ids){
      if(!driveAccessToken)break;
      if(!remote[photoFileName(id)]){
        const blob=await idbGetPhoto(id);
        if(blob){try{await uploadAppDataPhoto(id,blob);}catch(e){failed++;}}
      }
    }
  }finally{
    photoSyncRunning=false;
    if(photoSyncAgain){photoSyncAgain=false;syncPhotoFiles().catch(()=>{});}
  }
  return failed;
}

// ── PHOTO MIGRATION (converts old inline base64 photos to thumb + IndexedDB) ──
// Shrinks an oversized inline photo (`owner.img`) down to the standard thumbnail. Two cases:
//  • legacy inline original (>180k chars, from before the IndexedDB fix): the original is stored in IndexedDB FIRST;
//    if that fails the photo is left untouched so nothing is ever lost.
//  • older 900px thumbnail: the full-size copy already lives in IndexedDB/Drive, so only the thumbnail is shrunk
//    (it must NOT be stored as the "full-size" copy, or a second device would never pull the real one).
async function shrinkInlinePhoto(owner,id){
  const s=owner&&owner.img;
  if(!s||s.length<=45000||s.indexOf('data:')!==0)return false;
  try{
    const im=await loadImageFromDataURL(s);
    if(Math.max(im.naturalWidth,im.naturalHeight)<=THUMB_MAX+20&&s.length<=90000)return false;   // already a standard thumbnail
    if(s.length>180000&&!(await idbGetPhoto(id))){
      if(!(await idbPutPhoto(id,dataURLtoBlob(s))))return false;
    }
    owner.img=makeThumb(im);return true;
  }catch(e){return false;}
}
async function migratePhotoArray(arr){
  let changed=false;
  for(const p of arr)if(await shrinkInlinePhoto(p,p&&p.id))changed=true;
  return changed;
}
async function migrateInlinePhotos(){
  let changed=false;
  const home=userData('home',{rooms:[]});
  for(const r of(home.rooms||[])){
    if(await migratePhotoArray(r.photos||[]))changed=true;
    if(r.moodboard&&await migratePhotoArray(r.moodboard.tiles||[]))changed=true;
  }
  if(changed)saveData('home',home);
  const w=userData('wedding',{inspo:[]});
  if(await migratePhotoArray(w.inspo||[])){saveData('wedding',w);changed=true;}
  const h=userData('honeymoon',{rooms:[],inspo:[]});
  let hChanged=await migratePhotoArray(h.inspo||[]);
  for(const r of(h.rooms||[]))if(await migratePhotoArray(r.photos||[]))hChanged=true;
  if(hChanged){saveData('honeymoon',h);changed=true;}
  const d=userData('dayout',{plans:[]});
  let dChanged=false;
  for(const pl of(d.plans||[]))if(await migratePhotoArray(pl.photos||[]))dChanged=true;
  if(dChanged){saveData('dayout',d);changed=true;}
  const rec=userData('recipes',{items:[]});
  let recChanged=false;
  for(const it of rec.items){
    if(await shrinkInlinePhoto(it,it.id))recChanged=true;
    if(await migratePhotoArray(it.photos||[]))recChanged=true;
  }
  if(recChanged){saveData('recipes',rec);changed=true;}
  for(const ctx of['wedding','home','honeymoon','closet']){
    const boards=userData(`moodboards_${ctx}`,[]);
    let bChanged=false;
    for(const b of boards)if(await migratePhotoArray(b.tiles||[]))bChanged=true;
    if(bChanged){saveData(`moodboards_${ctx}`,boards);changed=true;}
  }
  if(changed)syncPhotosSoon();
  return changed;
}

function chooseBkFolder(id,name){
  const gd=userData('gdrive_backup',{});
  saveData('gdrive_backup',Object.assign({},gd,{enabled:true,folderId:id,folderName:name}));
  closeModal();openSettings();
  bkBackupNow(false);
}
function toggleBkBackup(){
  const gd=Object.assign({},userData('gdrive_backup',{}));gd.enabled=!gd.enabled;
  saveData('gdrive_backup',gd);openSettings();
  if(gd.enabled)bkBackupNow(false);
}
async function bkBackupNow(manual){
  const gd=userData('gdrive_backup',{});
  if(!gd.enabled||!gd.folderId)return;
  if(driveBlocked){lastBkBackupError='Backup paused: your Drive data did not fit on this device. Free up space and sync first.';if(manual)alert(lastBkBackupError);return;}   // never overwrite the backup with a partial copy
  const token=getBkToken();
  if(!token){if(manual)alert('Reconnect Google Drive backup in Settings.');return;}
  const keys={};
  Object.keys(localStorage).filter(k=>k.startsWith(`maison_${currentUser}_`)).forEach(k=>{try{keys[k]=JSON.parse(localStorage.getItem(k));}catch(e){}});
  const body=JSON.stringify({v:1,keys,exported:Date.now()});
  try{
    const auth={headers:{Authorization:'Bearer '+token}};
    const q=encodeURIComponent(`'${gd.folderId}' in parents and name='${BACKUP_FILENAME}' and trashed=false`);
    const lr=await bkFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id)`,auth);
    const lj=await lr.json();
    const existing=(lj.files||[])[0];
    if(existing){
      await bkFetch(`https://www.googleapis.com/upload/drive/v3/files/${existing.id}?uploadType=media`,{method:'PATCH',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body});
    }else{
      const form=new FormData();
      form.append('metadata',new Blob([JSON.stringify({name:BACKUP_FILENAME,parents:[gd.folderId]})],{type:'application/json'}));
      form.append('file',new Blob([body],{type:'application/json'}));
      await bkFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:{Authorization:'Bearer '+token},body:form});
    }
    lastBkBackupAt=Date.now();lastBkBackupError=null;
    if(manual){alert('Backed up to Google Drive ✓');openSettings();}
  }catch(e){
    lastBkBackupError=e.message;
    if(manual)alert('Backup failed: '+e.message);
  }
}
function scheduleBkBackup(){
  const gd=userData('gdrive_backup',{});if(!gd.enabled)return;
  if(bkBackupTimer)clearTimeout(bkBackupTimer);
  bkBackupTimer=setTimeout(()=>bkBackupNow(false),4000);
}

let capturedFullBlob=null;
function pickFile(src){
  const dd=document.getElementById('cap-dest');
  if(dd&&dd.value==='closet'){closeModal();if(src==='camera')closetCamera();else closetLibrary();return;}   // home-screen camera → new closet piece
  const fi=src==='camera'?document.getElementById('file-input-camera'):document.getElementById('file-input');fi.onchange=e=>{const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=async ev=>{
  const raw=ev.target.result;
  try{const{thumb,blob}=await processPhotoDataURL(raw);capturedDataURL=thumb;capturedFullBlob=blob;}
  catch(err){capturedDataURL=raw;capturedFullBlob=null;}
  const pw=document.getElementById('cap-preview-wrap');if(pw){pw.style.display='block';document.getElementById('cap-preview').src=capturedDataURL;}
};r.readAsDataURL(file);fi.value='';};fi.click();}
async function saveCapture(){
  if(!capturedDataURL){alert('Please select a photo first.');return;}
  const dest=document.getElementById('cap-dest').value;
  const note=document.getElementById('cap-note').value.trim(),link=document.getElementById('cap-link').value.trim();
  const price=parseFloat(document.getElementById('cap-price').value)||0,name=document.getElementById('cap-name').value.trim();
  const blob=capturedFullBlob;
  let newId=null;
  const photo={id:uid(),img:capturedDataURL,note,link,price,name,date:Date.now(),liked:false,archived:false};
  if(dest.startsWith('home_')){const home=userData('home',{rooms:[]});const room=home.rooms.find(r=>r.id===dest.replace('home_',''));if(room){room.photos=room.photos||[];room.photos.push(photo);saveData('home',home);newId=photo.id;}}
  else if(dest==='wedding'){const w=userData('wedding',{inspo:[]});w.inspo.push(photo);saveData('wedding',w);newId=photo.id;}
  else if(dest==='honeymoon'){const h=userData('honeymoon',{rooms:[],inspo:[],budget:0});if(!h.inspo)h.inspo=[];h.inspo.push(photo);saveData('honeymoon',h);newId=photo.id;}
  else if(dest.startsWith('dayout_')){const d=userData('dayout',{plans:[]});const pl=d.plans.find(p=>p.id===dest.replace('dayout_',''));if(pl){pl.photos=pl.photos||[];pl.photos.push(photo);saveData('dayout',d);newId=photo.id;}}
  else if(dest==='recipes_new'||dest==='recipes'){const r=userData('recipes',{items:[]});const rec={id:uid(),img:capturedDataURL,title:name||'New Recipe',tags:[],text:note,date:Date.now(),photos:[]};r.items.push(rec);saveData('recipes',r);newId=rec.id;}
  else if(dest.startsWith('recipe_')){const recId=dest.replace('recipe_','');const r=userData('recipes',{items:[]});const ri=r.items.find(i=>i.id===recId);if(ri){const p2={id:uid(),img:capturedDataURL,note,date:Date.now(),liked:false,archived:false};ri.photos=ri.photos||[];ri.photos.push(p2);saveData('recipes',r);newId=p2.id;}}
  if(blob&&newId)await idbPutPhoto(newId,blob);
  try{localStorage.setItem('maison_lastdest',dest);}catch(e){}
  capturedDataURL=null;capturedFullBlob=null;closeModal();showSection(currentSection);updatePanelBadge();
  syncPhotosSoon();
}

  if(activeRoomTab==='overview'){
    const photos=room.photos||[],items=room.items||[];
    const budget=room.budget||0,spent=items.reduce((s,it)=>s+(it.price||0),0)+photos.filter(p=>!p.archived).reduce((s,p)=>s+(p.price||0),0);
    const pct=budget>0?Math.min(spent/budget*100,100):0,over=budget>0&&spent>budget;
    content=`<div class="budget-block"><div class="budget-row"><div><div class="budget-label">${room.name} budget</div><div class="budget-amount${over?' over':''}">£${spent.toLocaleString(undefined,{minimumFractionDigits:2})} <span style="font-size:14px;color:var(--muted)">/ £${(budget||0).toLocaleString()}</span></div></div><button class="btn-ghost" onclick="editRoomBudget('${room.id}')">Edit</button></div><div class="bar-track"><div class="bar-fill${over?' over':''}" style="width:${pct}%"></div></div><div class="bar-note${over?' over':''}">${over?'Over budget':'Remaining: £'+(budget-spent).toLocaleString(undefined,{minimumFractionDigits:2})}</div></div>
      <div class="flex-between mb14"><div style="font-family:var(--sans);font-size:16px;color:var(--muted)">Furniture &amp; items</div><div class="flex-center"><button class="btn-ghost" onclick="openAddItem('${room.id}')">+ Add item</button><button class="btn-ghost danger" onclick="deleteRoom('${room.id}')">Delete room</button></div></div>
      ${renderItemList(items,room.id)}`;
  } else if(activeRoomTab==='photos'){
    content=renderPhotoGrid(room.photos||[],'home_room',room.id);
  } else {
    content=renderRoomMoodboard(room);
  }
  main.innerHTML=`<div class="section-rule"><div><div class="section-title">Rooms</div><div class="section-sub">Track every room, budget &amp; piece of furniture.</div></div><div class="flex-center">${quickNotesBtn('home')}<button class="btn-solid sm" onclick="openAddRoom()">+ Room</button></div></div><div class="room-tabs-row">${tabs}</div><div class="room-sub-tabs">${subTabs}</div>${content}`;
}

function renderItemList(items,roomId){
  if(!items.length)return`<div class="empty" style="padding:20px 0;font-size:13px">No items yet.</div>`;
  return items.map(it=>`<div class="item-row">${it.img?`<img class="item-thumb" src="${it.img}"/>`:`<div class="item-thumb-ph">🛋</div>`}<div class="item-body"><div class="item-name">${it.name||'Item'}</div>${it.store?`<div class="item-store">${it.store}</div>`:''}${it.link?`<a class="item-link" href="${it.link}" target="_blank" rel="noopener">${it.link}</a>`:''}</div>${it.price?`<div class="item-price">£${it.price.toLocaleString(undefined,{minimumFractionDigits:2})}</div>`:''}<button class="icon-btn" onclick="deleteItem('${roomId}','${it.id}')"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg></button></div>`).join('');

// ── ROOM MOOD BOARD ──
function renderRoomMoodboard(room){
  const mb=room.moodboard||{colors:[],tiles:[],notes:''};
  const swatches=mb.colors.length?mb.colors.map((c,i)=>`<div class="mb-swatch-wrap"><div class="mb-swatch" style="background:${c.hex}" title="${c.ral?'RAL '+c.ral:''}"></div><button class="mb-swatch-del" onclick="removeRoomColor('${room.id}',${i})">×</button><div class="mb-swatch-label">${c.ral?'RAL '+c.ral:c.name||''}</div></div>`).join(''):`<p style="font-size:13px;color:var(--muted);">No colours yet.</p>`;

  return`<div style="margin-bottom:20px">
    <div class="flex-between mb14"><div style="font-family:var(--sans);font-size:16px;color:var(--muted)">Colour palette</div><button class="btn-ghost" onclick="openAddColor('${room.id}')">+ Add colour</button></div>
    <div style="display:flex;flex-wrap:wrap;gap:12px;margin-bottom:20px">${swatches}</div>
    <div class="flex-between mb14"><div style="font-family:var(--sans);font-size:16px;color:var(--muted)">Inspiration images</div><button class="btn-ghost" onclick="openAddRoomMoodTile('${room.id}')">+ Add image</button></div>
    <div style="display:flex;flex-wrap:wrap;gap:10px">${tiles}</div>
    ${mb.notes?`<div style="margin-top:14px;font-size:13px;color:var(--muted);">${mb.notes}</div>`:''}

}

function openAddColor(roomId){
  const dropperBtn=typeof EyeDropper!=='undefined'?`<button class="btn-ghost" style="margin-bottom:14px;width:100%" onclick="useDropper('${roomId}')">Pick colour from screen</button>`:`<p style="font-size:12.5px;color:var(--muted);margin-bottom:14px;">Screen colour picker available in Chrome/Edge.</p>`;
  openModal(`<div class="modal-head"><div class="modal-title">Add colour</div><button class="modal-close" onclick="closeModal()">×</button></div>
    <label class="field-label">Colour picker</label>
    <input id="color-picker" type="color" value="#c9b89a" class="color-picker-input"/>

    <label class="field-label">Or enter RAL number</label>
    <div class="ral-row mb14">
      <input id="ral-input" class="field-input" placeholder="e.g. 9010" style="margin-bottom:0" oninput="previewRal(this.value)"/>
      <div id="ral-preview" class="ral-preview-box"></div>
    </div>
    <div id="ral-name" style="font-size:12px;color:var(--muted);margin-bottom:14px;margin-top:-12px"></div>
    <label class="field-label">Colour name (optional)</label>

function previewRal(val){
  const clean=val.trim().replace(/^RAL\s*/i,'');
  const hex=RAL[clean],name=RAL_NAMES[clean]||'';
  const preview=document.getElementById('ral-preview'),nameEl=document.getElementById('ral-name');
  if(preview)preview.style.background=hex||'transparent';
  if(nameEl)nameEl.textContent=hex?`RAL ${clean} — ${name}`:clean.length>=4?'RAL number not found':'';
}

function saveColor(roomId){
  const ralRaw=(document.getElementById('ral-input')?.value||'').trim().replace(/^RAL\s*/i,'');
  const pickerVal=document.getElementById('color-picker')?.value||'#808080';
  const nameVal=(document.getElementById('color-name')?.value||'').trim();
  let hex,ral=null,name=nameVal;
  if(ralRaw&&RAL[ralRaw]){hex=RAL[ralRaw];ral=ralRaw;if(!name)name=RAL_NAMES[ralRaw]||'';}
  else hex=pickerVal;
  const home=userData('home',{rooms:[]});const room=home.rooms.find(r=>r.id===roomId);if(!room)return;
  room.moodboard=room.moodboard||{colors:[],tiles:[],notes:''};
  room.moodboard.colors.push({id:uid(),hex,ral,name});
  saveData('home',home);closeModal();showSection('home');
}

function removeRoomColor(roomId,idx){
  const home=userData('home',{rooms:[]});const room=home.rooms.find(r=>r.id===roomId);
  if(room&&room.moodboard){room.moodboard.colors.splice(idx,1);saveData('home',home);}showSection('home');
}

async function useDropper(roomId){
  try{const dropper=new EyeDropper();const result=await dropper.open();const picker=document.getElementById('color-picker');if(picker)picker.value=result.sRGBHex;}catch(e){}
}

function openAddRoomMoodTile(roomId){
  const fi=document.getElementById('rm-tile-input');
  fi.onchange=e=>{
    Array.from(e.target.files).forEach(file=>{const r=new FileReader();r.onload=async ev=>{
      const id=uid();
      let thumb=ev.target.result,blob=null;
      try{const p=await processPhotoDataURL(ev.target.result);thumb=p.thumb;blob=p.blob;}catch(err){}
      const home=userData('home',{rooms:[]});const room=home.rooms.find(r=>r.id===roomId);if(!room)return;room.moodboard=room.moodboard||{colors:[],tiles:[],notes:''};room.moodboard.tiles=room.moodboard.tiles||[];room.moodboard.tiles.push({id,img:thumb,size:'md'});saveData('home',home);
      if(blob)await idbPutPhoto(id,blob);
      syncPhotosSoon();showSection('home');
    };r.readAsDataURL(file);});fi.value='';
  };fi.click();
}

function removeRoomMoodTile(roomId,idx){
  const home=userData('home',{rooms:[]});const room=home.rooms.find(r=>r.id===roomId);
  if(room&&room.moodboard){
    const removed=room.moodboard.tiles[idx];
    room.moodboard.tiles.splice(idx,1);saveData('home',home);
    if(removed){idbDeletePhoto(removed.id).catch(()=>{});deleteRemotePhoto(removed.id).catch(()=>{});}
  }
  showSection('home');
}

function renderFloorPlanView(){
  const fp=userData('floorplan',{img:null,markers:[]});
  if(!fp.img)return`<div style="text-align:center;padding:48px 20px"><div style="font-size:48px;opacity:.3;margin-bottom:16px">🏠</div><p style="font-size:15px;color:var(--muted);margin-bottom:20px">Upload a floor plan image to get started</p><button class="btn-solid sm" onclick="document.getElementById('fp-file-input').click()">Upload floor plan</button><p style="font-size:12.5px;color:var(--muted);margin-top:12px;">Supports JPG and PNG</p></div>`;

function floorPlanClick(e){if(e.target.closest('.fp-marker'))return;const rect=e.currentTarget.getBoundingClientRect();const x=((e.clientX-rect.left)/rect.width*100).toFixed(1);const y=((e.clientY-rect.top)/rect.height*100).toFixed(1);openAddMarkerModal(parseFloat(x),parseFloat(y));}

function saveMarker(x,y){const roomId=document.getElementById('marker-room').value;const home=userData('home',{rooms:[]});const room=home.rooms.find(r=>r.id===roomId);if(!room)return;const fp=userData('floorplan',{img:null,markers:[]});fp.markers.push({id:uid(),x,y,roomId,label:room.name});saveData('floorplan',fp);closeModal();showSection('home');}
function deleteMarker(markerId){const fp=userData('floorplan',{img:null,markers:[]});fp.markers=fp.markers.filter(m=>m.id!==markerId);saveData('floorplan',fp);showSection('home');}

function parseIngredientLines(text){return text.split('\n').map(l=>l.replace(/^\s*[-•*]\s*/,'').trim()).filter(Boolean);}
function parseMethodLines(text){
  let lines=text.split('\n').map(l=>l.trim()).filter(Boolean);
  if(lines.length<=1){
    const chunks=text.split(/(?=\d+[\.\)]\s)/).map(l=>l.trim()).filter(Boolean);
    if(chunks.length>1)lines=chunks;
  }
  return lines.map(l=>l.replace(/^\s*(\d+[\.\)]|step\s*\d+[:\.]?)\s*/i,'').trim()).filter(Boolean);
}
function parseIngredientLine(line){
  const m=line.match(/^\s*(\d+\s+\d+\/\d+|\d+\/\d+|\d+\.\d+|\d+)\s*(.*)$/);
  if(!m)return{qty:null,rest:line.trim()};
  const qtyStr=m[1];let qty;
  if(qtyStr.includes(' ')){const[whole,frac]=qtyStr.split(' ');const[n,d]=frac.split('/').map(Number);qty=Number(whole)+n/d;}
  else if(qtyStr.includes('/')){const[n,d]=qtyStr.split('/').map(Number);qty=n/d;}
  else qty=parseFloat(qtyStr);
  return{qty,rest:m[2].trim()};
}
function formatQty(n){
  if(n==null)return'';
  const whole=Math.floor(n),frac=n-whole;
  const fracMap=[[0.125,'⅛'],[0.166,'⅙'],[0.2,'⅕'],[0.25,'¼'],[0.333,'⅓'],[0.375,'⅜'],[0.4,'⅖'],[0.5,'½'],[0.6,'⅗'],[0.625,'⅝'],[0.666,'⅔'],[0.75,'¾'],[0.8,'⅘'],[0.833,'⅚'],[0.875,'⅞']];
  let closest=null,closestDiff=0.02;
  for(const[val,sym]of fracMap){const diff=Math.abs(frac-val);if(diff<closestDiff){closest=sym;closestDiff=diff;}}
  if(closest)return whole>0?`${whole}${closest}`:closest;
  return String(Math.round(n*100)/100);
}

function pickRecipePhoto(){const fi=document.getElementById('rec-file');fi.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=async ev=>{
  try{const{thumb,blob}=await processPhotoDataURL(ev.target.result);recipeImgData=thumb;recipeFullBlobPending=blob;}
  catch(err){recipeImgData=ev.target.result;recipeFullBlobPending=null;}
  const p=document.getElementById('rec-img-preview');if(p){p.src=recipeImgData;p.style.display='block';}
};r.readAsDataURL(f);};fi.click();}
async function saveRecipe(editId){
  const title=document.getElementById('rec-title').value.trim();if(!title)return;
  const tags=document.getElementById('rec-tags').value.split(',').map(t=>t.trim()).filter(Boolean);
  const servings=parseInt(document.getElementById('rec-servings').value,10)||4;
  const ingredients=parseIngredientLines(document.getElementById('rec-ingredients').value);
  const method=parseMethodLines(document.getElementById('rec-method').value);
  const tips=document.getElementById('rec-tips').value.trim();
  const r=userData('recipes',{items:[]});
  let finalId=editId;
  if(editId){
    const item=r.items.find(i=>i.id===editId);
    if(item)Object.assign(item,{title,tags,servings,ingredients,method,tips,img:recipeImgData||null});
  }else{
    finalId=uid();
    r.items.push({id:finalId,title,tags,servings,ingredients,method,tips,img:recipeImgData||null,date:Date.now(),photos:[]});
  }
  saveData('recipes',r);
  if(recipeFullBlobPending&&finalId)await idbPutPhoto(finalId,recipeFullBlobPending);
  recipeImgData=null;recipeFullBlobPending=null;
  closeModal();showSection('recipes');
  syncPhotosSoon();
}
function viewRecipe(id,overrideServings){
  const item=userData('recipes',{items:[]}).items.find(i=>i.id===id);if(!item)return;
  const baseServings=item.servings||4;
  const curServings=overrideServings||baseServings;
  const multiplier=curServings/baseServings;
  const ingredients=item.ingredients||[];
  const method=item.method||[];
  const hasStructured=ingredients.length||method.length;
  const ingredientsHtml=ingredients.length?`<div style="margin-top:18px">
    <div class="recipe-section-label">Ingredients</div>
    <div class="serving-adjust">
      <button class="serving-btn" onclick="viewRecipe('${id}',${Math.max(1,curServings-1)})">−</button>
      <span class="serving-count">${curServings} serving${curServings!==1?'s':''}</span>
      <button class="serving-btn" onclick="viewRecipe('${id}',${curServings+1})">+</button>
    </div>
    <ul class="ingredient-list">${ingredients.map(line=>{const{qty,rest}=parseIngredientLine(line);const display=qty!=null?`${formatQty(qty*multiplier)} ${rest}`:rest;return`<li>${escHtml(display)}</li>`;}).join('')}</ul>
  </div>`:'';
  const methodHtml=method.length?`<div style="margin-top:18px"><div class="recipe-section-label">Method</div><ol class="method-list">${method.map(step=>`<li>${escHtml(step)}</li>`).join('')}</ol></div>`:'';
  const tipsHtml=item.tips?`<div style="margin-top:18px"><div class="recipe-section-label">Tips</div><p style="font-size:14px;line-height:1.7;color:var(--muted);white-space:pre-wrap">${escHtml(item.tips)}</p></div>`:'';

  const extraPhotos=item.photos||[];

function timeAgo(ts){
  if(!ts)return'';
  const diff=Date.now()-ts,mins=Math.floor(diff/60000);
  if(mins<2)return'Just now';
  if(mins<60)return`${mins}m ago`;
  const hrs=Math.floor(mins/60);
  if(hrs<24)return`${hrs}h ago`;
  const days=Math.floor(hrs/24);
  if(days<7)return`${days} day${days!==1?'s':''} ago`;
  return new Date(ts).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
}

const SONG_MAX_BYTES=80*1048576;
function songFilePicked(inp){
  const f=inp.files&&inp.files[0],hint=document.getElementById('song-file-hint'),t=document.getElementById('song-title');
  if(!f||!hint)return;
  if(f.size>SONG_MAX_BYTES){hint.textContent='That file is '+(f.size/1048576).toFixed(0)+' MB. The limit is 80 MB, so please choose a smaller one.';inp.value='';return;}
  hint.textContent=f.name+' · '+(f.size/1048576).toFixed(1)+' MB';
  if(t&&!t.value.trim())t.value=f.name.replace(/\.[^.]+$/,'').replace(/[_]+/g,' ');
}
// Only web links are kept as links (blocks javascript: and similar), and a bare "spotify.com/…" gets https://
function safeLink(u){u=(u||'').trim();if(!u)return'';if(!/^[a-z][a-z0-9+.-]*:/i.test(u))u='https://'+u;return/^https?:\/\//i.test(u)?u:'';}
async function saveSong(playlistId){
  const title=(document.getElementById('song-title').value||'').trim();if(!title)return;
  const m=userData('music',{playlists:[]});const pl=m.playlists.find(p=>p.id===playlistId);if(!pl)return;
  const fileInp=document.getElementById('song-file'),file=fileInp&&fileInp.files&&fileInp.files[0];
  const id=uid(),song={id,title,artist:(document.getElementById('song-artist').value||'').trim(),link:safeLink(document.getElementById('song-link').value),note:(document.getElementById('song-note').value||'').trim(),date:Date.now()};
  if(file){
    if(file.size>SONG_MAX_BYTES){clToast('That file is over 80 MB');return;}
    const btn=document.getElementById('song-save');if(btn){btn.disabled=true;btn.textContent='Saving…';}
    const ok=await idbPutPhoto(id,file);   // store the song on this device first; if that fails nothing is added
    if(!ok){if(btn){btn.disabled=false;btn.textContent='Add to playlist';}return;}
    song.audio={name:file.name,type:file.type||'audio/mpeg',size:file.size};
  }
  pl.songs=pl.songs||[];pl.songs.push(song);
  if(!saveData('music',m)){if(song.audio)idbDeletePhoto(id).catch(()=>{});const btn=document.getElementById('song-save');if(btn){btn.disabled=false;btn.textContent='Add to playlist';}return;}
  closeModal();showSection('music');
  if(song.audio)syncPhotosSoon();
}
function deleteSong(playlistId,songId){
  const m=userData('music',{playlists:[]});const pl=m.playlists.find(p=>p.id===playlistId);
  if(pl){dropSongAudio((pl.songs||[]).find(s=>s.id===songId));pl.songs=(pl.songs||[]).filter(s=>s.id!==songId);saveData('music',m);}showSection('music');
}
